<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090e" />
    <title>Observer</title>

    <!--
      Fonts are self-hosted from /fonts and must stay that way: docs/privacy.md
      guarantees Observer makes no outbound network calls, and a webfont CDN
      link would leak the developer's IP and every page load to a third party.
      Rationale and licences: apps/web/src/index.css, apps/web/public/fonts.

      Same-origin font fetches are still CORS-mode, so crossorigin is required
      on the preload or the browser fetches the file twice.
    -->
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Paints the canvas dark before the stylesheet lands, so there is no
         white flash on a tool that is looked at in a dark editor. -->
    <style>
      html,
      body {
        margin: 0;
        background: #07090e;
        color: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
